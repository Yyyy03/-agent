[project]
name = "fire-agent"
version = "0.1.0"
description = "FIRE Agent: benchmark-aligned financial reasoning and evidence agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "FIRE Agent contributors"}
]
keywords = ["financial-agent", "benchmark", "reasoning", "evidence", "tool-use"]
dependencies = [
    "docling>=2.97.0",
    "json_repair>=0.44.1",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
]

[project.scripts]
fire-agent = "fire_agent.cli:main"
fire-agent-benchmarks = "fire_agent.run_benchmarks:main"
fire-agent-prepare-finrpt = "fire_agent.prepare_finrpt:main"
fire-agent-prepare-findocresearch = "fire_agent.prepare_findocresearch:main"
fire-agent-sft-export = "fire_agent.sft.export_events:main"
fire-agent-sft-export-slime-qwen35 = "fire_agent.sft.export_slime_qwen35_sft:main"
fire-agent-sft-build-slime-episode-view = "fire_agent.sft.build_slime_episode_view:main"
fire-agent-sft-bucket-slime-episode-view = "fire_agent.sft.bucket_slime_episode_view:main"
fire-agent-sft-generate-fin-deepsearch = "fire_agent.sft.generate_fin_deepsearch_sft_data:main"
fire-agent-sft-train = "fire_agent.sft.train_qwen_sft:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
